<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>A-TUT-MATH-01 · חשבון · א׳ תות</title>
<style>
:root{--bg:#f5f4f0;--card:#fff;--ink:#1c2230;--navy:#1f3b5c;--mute:#667085;--line:#d9d6cc;--blue:#3a78c2;--org:#e8862a;--good:#2f8f4e;--warn:#d98a1c;--bad:#d9534f;--hl:#fff4dc;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-text-size-adjust:100%;overflow:hidden}
body{display:flex;flex-direction:column;max-height:100dvh}
header{background:var(--navy);color:#fff;flex:none;z-index:20}
.hw{max-width:980px;margin:0 auto;padding:8px 12px;display:flex;align-items:center;gap:8px}
header h1{margin:0;font-size:16px;font-weight:750;flex:1;min-width:0;line-height:1.2}
header h1 small{display:block;font-weight:500;opacity:.85;font-size:11px;margin-top:1px}
.iconb{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:10px;width:40px;height:40px;font-size:18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none;padding:0}
.iconb[aria-pressed=true]{background:#fff;color:var(--navy)}
main{flex:1;min-height:0;max-width:980px;width:100%;margin:0 auto;padding:8px 10px;display:flex;flex-direction:column;overflow:hidden}
.screen{display:none;flex:1;min-height:0;flex-direction:column;overflow:hidden}
.screen.on{display:flex}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;min-height:0;flex:1;overflow:hidden}
.card h2{margin:0 0 4px;font-size:17px;color:var(--ink);font-weight:750}
.sub{color:var(--mute);font-size:12.5px;margin:0 0 8px}
.topics{display:grid;gap:7px;grid-template-columns:1fr;overflow:auto;min-height:0;-webkit-overflow-scrolling:touch}
.tbtn{border:1px solid var(--ink);background:#fff;border-radius:12px;padding:10px 12px;text-align:right;cursor:pointer;font:700 15px system-ui,-apple-system,sans-serif;color:var(--ink);min-height:48px;display:flex;align-items:center;gap:10px}
.tbtn .n{font-size:18px;font-weight:800;color:var(--org);width:22px;flex:none}
.tbtn .meta{flex:1;min-width:0}.tbtn .meta small{display:block;font-weight:500;color:var(--mute);font-size:11.5px;margin-top:1px}
.exwrap{display:flex;flex-direction:column;flex:1;min-height:0;gap:6px}
.toprow{display:flex;align-items:center;gap:8px;flex:none}
.toprow .ttl{flex:1;font-weight:750;color:var(--navy);font-size:14.5px;min-width:0}
.info{display:inline-flex;align-items:center;gap:5px;border:0;background:var(--navy);color:#fff;border-radius:999px;padding:4px 10px 4px 5px;min-height:32px;font:700 12px system-ui;cursor:pointer;flex:none}
.info .ic{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#fff;color:var(--navy);font:italic 800 14px Georgia,serif}
.prompt{font-size:17px;font-weight:750;color:var(--navy);margin:0;text-align:center;flex:none;line-height:1.25}
.stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage-inner{width:100%;max-height:100%;text-align:center}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:7px;flex:none}
.choices.row3{grid-template-columns:1fr 1fr 1fr}
.choices.row4{grid-template-columns:repeat(4,1fr)}
.cbtn{border:1.5px solid var(--ink);background:#fff;border-radius:12px;min-height:48px;font:800 22px system-ui,-apple-system,sans-serif;color:var(--ink);cursor:pointer;padding:6px 4px;touch-action:manipulation}
.cbtn:disabled{opacity:.55;cursor:default}
.cbtn.ok{background:#eef8f1;border-color:var(--good);color:var(--good)}
.cbtn.bad{background:#fff6e8;border-color:var(--warn);color:var(--warn);animation:nudge .35s}
@keyframes nudge{0%,100%{transform:none}30%{transform:translateX(-4px)}70%{transform:translateX(4px)}}
.nline-wrap{position:relative;padding:6px 4px 0;direction:ltr}
.nline-wrap .bar{height:3px;background:var(--ink);position:absolute;top:12px;left:16px;right:16px}
.nline{direction:ltr;display:flex;justify-content:center;gap:0;overflow:hidden}
.nline .tick{flex:0 0 auto;width:36px;text-align:center}
.nline .tick::before{content:"";display:block;width:2px;height:12px;background:var(--ink);margin:0 auto 3px}
.nline .num{font:800 14px system-ui;color:var(--ink)}
.nline .gap{font:800 18px system-ui;color:var(--org);width:34px;height:30px;border:2px dashed var(--org);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;background:var(--hl)}
.bignum{font:800 56px/1 system-ui;color:var(--navy)}
.tenframe{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:200px;margin:0 auto;direction:ltr;border:2.5px solid var(--navy);border-radius:10px;padding:6px;background:#fff}
.dot{aspect-ratio:1;border-radius:50%;background:#e8edf5;border:1.5px solid #c5d0e0}
.dot.on{background:var(--blue);border-color:var(--navy)}
.tenlab{font-size:12px;color:var(--mute);font-weight:600;margin-top:4px}
.polybox svg{width:min(140px,38vw);height:auto;display:block;margin:0 auto}
.fb{flex:none;border-radius:8px;padding:5px 8px;font-weight:700;text-align:center;font-size:13px;display:none;min-height:0}
.fb.on{display:block}
.fb.ok{background:#eef8f1;color:#1f6b38}
.fb.bad{background:#fff6e8;color:#8a5200}
.endbtns{display:flex;flex-wrap:nowrap;gap:7px;flex:none}
.endbtns[hidden]{display:none!important}
.btn{border:1px solid var(--ink);background:#fff;color:var(--ink);border-radius:12px;padding:8px 12px;min-height:42px;font:700 14px system-ui,-apple-system,sans-serif;cursor:pointer;flex:1;min-width:0}
.btn.pri{background:var(--good);border-color:var(--good);color:#fff}
.btn:disabled{opacity:.35;cursor:default}
.priv{font-size:11px;color:var(--mute);text-align:center;margin:6px 0 0;flex:none}
.foot{flex:none;background:rgba(245,244,240,.97);border-top:1px solid var(--line);padding:4px 10px;font-size:10px;color:var(--mute);text-align:center}
.explain{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;display:none}
.explain.on{display:block}
.xbar{position:sticky;top:0;background:rgba(245,244,240,.96);border-bottom:1px solid var(--line);padding:8px 12px;z-index:2;display:flex;gap:8px;align-items:center}
.xin{max-width:820px;margin:0 auto;padding:12px 14px 24px}
.xin h2{font-size:18px;color:var(--navy);margin:0 0 8px}
.idea{background:#eef4fb;border-radius:10px;padding:10px 12px;font-size:14.5px;font-weight:600;color:var(--navy)}
@media(min-width:600px){
  header h1{font-size:18px}.cbtn{min-height:56px;font-size:26px}.bignum{font-size:72px}
  .polybox svg{width:180px}.tenframe{max-width:260px}.prompt{font-size:19px}
  .topics{grid-template-columns:1fr 1fr}
}
@media(max-height:700px){
  .bignum{font-size:44px}.cbtn{min-height:44px;font-size:20px}.polybox svg{width:min(110px,32vw)}
  .tenframe{max-width:160px;gap:3px;padding:4px}.nline .tick{width:30px}.prompt{font-size:15px}
  .card{padding:8px 10px}.btn{min-height:38px;font-size:13px}
}
</style>
</head>
<body>
<header><div class="hw">
  <button class="iconb" id="btnMenu" type="button" title="תפריט" aria-label="חזרה לתפריט">☰</button>
  <h1>חשבון · א׳ תות <small>בית ספר אשכולות</small></h1>
  <button class="iconb" id="btnSpeak" type="button" title="השמעה" aria-label="השמעה">🔊</button>
  <button class="iconb" id="btnMute" type="button" title="השתקה" aria-label="השתקה" aria-pressed="false">🔈</button>
</div></header>
<main>
  <section class="screen on" id="sc-menu">
    <div class="card">
      <h2>מה תרצו לתרגל?</h2>
      <p class="sub">נושא אחד בכל פעם. לוחצים ושומעים. בלי להקליד.</p>
      <div class="topics" id="topicList"></div>
      <p class="priv">🔒 אין שמירת נתונים · אין עוגיות · הכל על המכשיר שלכם</p>
    </div>
  </section>
  <section class="screen" id="sc-ex">
    <div class="card">
      <div class="exwrap">
        <div class="toprow">
          <div class="ttl" id="exTopic"></div>
          <button class="info" id="btnHelp" type="button"><span class="ic">?</span>עזרה</button>
        </div>
        <p class="prompt" id="exPrompt"></p>
        <div class="stage"><div class="stage-inner" id="exStage"></div></div>
        <div class="choices" id="exChoices"></div>
        <div class="fb" id="exFb"></div>
        <div class="endbtns" id="exActions" hidden>
          <button class="btn pri" id="btnMore" type="button">עוד תרגיל</button>
          <button class="btn" id="btnNext" type="button">לנושא הבא ←</button>
        </div>
      </div>
    </div>
  </section>
</main>
<div class="explain" id="helpPanel" role="dialog" aria-modal="true">
  <div class="xbar">
    <button class="btn" id="helpClose" type="button">חזרה ←</button>
    <strong id="helpTitle" style="flex:1;color:var(--navy)">עזרה</strong>
  </div>
  <div class="xin"><h2 id="helpH2"></h2><div class="idea" id="helpBody"></div></div>
</div>
<div class="foot">A-TUT-MATH-01 · טיוטה · א׳ תות · לא לפרסום</div>
<script>
(function(){
"use strict";
const AUDIO="audio/";
const TOPICS=[
  {k:"line",t:"ישר המספרים",help:"הסתכלו על הישר. איזה מספר חסר בין המספרים?",speak:"t_line",helpKey:"help_line"},
  {k:"prev",t:"המספר הקודם והבא",help:"המספר הקודם הוא אחד פחות. המספר הבא הוא אחד יותר.",speak:"t_prev",helpKey:"help_prev"},
  {k:"struct",t:"מבנה המספרים",help:"חשבו איך לחבר שני מספרים קטנים כדי לקבל את המספר הגדול.",speak:"t_struct",helpKey:"help_struct"},
  {k:"poly",t:"סוגי מצולעים",help:"ספרו את הצלעות ואת הקדקדים. משולש – שלוש, ריבוע – ארבע שוות, מלבן – ארבע.",speak:"t_poly",helpKey:"help_poly"}
];
const POLY=[
  {k:"tri",name:"משולש",sides:3,svg:(c)=>`<polygon points="110,18 200,190 20,190" fill="${c}" stroke="#1f3b5c" stroke-width="5"/>`},
  {k:"sq",name:"ריבוע",sides:4,svg:(c)=>`<rect x="35" y="35" width="150" height="150" rx="4" fill="${c}" stroke="#1f3b5c" stroke-width="5"/>`},
  {k:"rect",name:"מלבן",sides:4,svg:(c)=>`<rect x="20" y="55" width="180" height="110" rx="4" fill="${c}" stroke="#1f3b5c" stroke-width="5"/>`},
  {k:"pent",name:"מחומש",sides:5,svg:(c)=>{const p=reg(5,110,110,85);return `<polygon points="${p}" fill="${c}" stroke="#1f3b5c" stroke-width="5"/>`}},
  {k:"hex",name:"משושה",sides:6,svg:(c)=>{const p=reg(6,110,110,85);return `<polygon points="${p}" fill="${c}" stroke="#1f3b5c" stroke-width="5"/>`}}
];
const COLORS=["#dce8f6","#fde3c8","#e3f1e8","#f1e6f7","#fff4dc"];
function reg(n,cx,cy,r){const a=[];for(let i=0;i<n;i++){const t=-Math.PI/2+i*2*Math.PI/n;a.push((cx+r*Math.cos(t)).toFixed(1)+","+(cy+r*Math.sin(t)).toFixed(1))}return a.join(" ")}
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function shuffle(a){const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
let muted=false,currentAudio=null,topicIdx=0,exercise=null,answered=false;
const $=s=>document.querySelector(s);
function stopSpeak(){if(currentAudio){try{currentAudio.pause();currentAudio.src=""}catch(e){}currentAudio=null}if(window.speechSynthesis)speechSynthesis.cancel()}
function speakKeys(keys){if(muted)return;stopSpeak();const list=(Array.isArray(keys)?keys:[keys]).filter(Boolean);playSeq(list,0)}
function playSeq(list,i){if(i>=list.length)return;const key=list[i];const a=new Audio(AUDIO+key+".mp3");currentAudio=a;a.onended=()=>playSeq(list,i+1);a.onerror=()=>fallbackSay(key,()=>playSeq(list,i+1));a.play().catch(()=>fallbackSay(key,()=>playSeq(list,i+1)))}
function fallbackSay(key,done){if(!window.speechSynthesis){done&&done();return}
  const map={q_missing:"מה המספר החסר?",q_prev:"מה המספר הקודם?",q_next:"מה המספר הבא?",q_make:"איזה שני מספרים מרכיבים את המספר?",q_poly:"איזו צורה זאת?",q_sides:"כמה צלעות יש לצורה?",q_vertices:"כמה קדקדים יש לצורה?",ok:"כל הכבוד!",ok2:"נכון מאוד!",ok3:"יפה מאוד!",try:"לא נורא. נסו עוד פעם.",almost:"כמעט! נסו שוב."};
  let t=map[key];if(!t&&/^n\d+$/.test(key)){const names=["אפס","אחת","שתיים","שלוש","ארבע","חמש","שש","שבע","שמונה","תשע","עשר","אחת עשרה","שתים עשרה","שלוש עשרה","ארבע עשרה","חמש עשרה","שש עשרה","שבע עשרה","שמונה עשרה","תשע עשרה","עשרים"];t=names[+key.slice(1)]||key.slice(1)}
  if(!t){done&&done();return}const u=new SpeechSynthesisUtterance(t);u.lang="he-IL";u.rate=.92;u.onend=()=>done&&done();u.onerror=()=>done&&done();speechSynthesis.speak(u)}
function sayOk(){speakKeys(pick(["ok","ok2","ok3"]))}function sayBad(){speakKeys(pick(["try","almost"]))}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));$("#"+id).classList.add("on")}
function buildMenu(){$("#topicList").innerHTML=TOPICS.map((t,i)=>`<button class="tbtn" type="button" data-i="${i}"><span class="n">${i+1}</span><span class="meta">${t.t}<small>תרגול בלחיצה</small></span></button>`).join("");$("#topicList").onclick=e=>{const b=e.target.closest(".tbtn");if(!b)return;topicIdx=+b.dataset.i;startTopic()}}
function startTopic(){answered=false;show("sc-ex");$("#exTopic").textContent=TOPICS[topicIdx].t;$("#exActions").hidden=true;$("#exFb").className="fb";newExercise()}
function newExercise(){answered=false;stopSpeak();$("#exActions").hidden=true;$("#exFb").className="fb";$("#exFb").textContent="";const k=TOPICS[topicIdx].k;if(k==="line")exercise=makeLine();else if(k==="prev")exercise=makePrev();else if(k==="struct")exercise=makeStruct();else exercise=makePoly();renderEx();setTimeout(()=>speakKeys(exercise.speak),150)}
function makeLine(){const max=rnd(0,1)?10:20;const start=rnd(0,Math.max(0,max-6));const len=Math.min(7,max-start+1);const nums=[];for(let i=0;i<len;i++)nums.push(start+i);const missIdx=rnd(1,len-2);const missing=nums[missIdx];const distractors=shuffle([missing-2,missing-1,missing+1,missing+2,...nums].filter(n=>n>=0&&n<=max&&n!==missing));
  const opts=[missing];
  for(const n of distractors){if(opts.includes(n))continue;opts.push(n);if(opts.length===4)break}
  return{prompt:"מה המספר החסר?",speak:["q_missing"],stageHtml:`<div class="nline-wrap"><div class="bar"></div><div class="nline">${nums.map((n,i)=>i===missIdx?`<div class="tick"><span class="gap">?</span></div>`:`<div class="tick"><span class="num">${n}</span></div>`).join("")}</div></div>`,choices:shuffle(opts).map(n=>({v:n,label:String(n)})),answer:missing}}
function makePrev(){const n=rnd(1,19);const kind=Math.random()<.5?"prev":"next";const ans=kind==="prev"?n-1:n+1;const wrong=shuffle([n,n+2,n-2,ans+3,ans-3].filter(x=>x>=0&&x<=20&&x!==ans)).slice(0,3);return{prompt:kind==="prev"?`מה המספר הקודם ל־${n}?`:`מה המספר הבא אחרי ${n}?`,speak:kind==="prev"?["q_prev","n"+n]:["q_next","n"+n],stageHtml:`<div class="bignum">${n}</div>`,choices:shuffle([ans,...wrong]).map(v=>({v,label:String(v)})),answer:ans}}
function makeStruct(){const total=rnd(4,10);const a=rnd(1,total-1),b=total-a;const pairs=[[a,b]];let g=0;while(pairs.length<4&&g++<80){const w=rnd(0,10),z=rnd(0,10);if(w+z===total)continue;if(pairs.some(p=>p[0]===w&&p[1]===z))continue;pairs.push([w,z])}const dots=Array.from({length:10},(_,i)=>`<div class="dot ${i<total?"on":""}"></div>`).join("");return{prompt:`איזה שני מספרים מרכיבים את ${total}?`,speak:["q_make","n"+total],stageHtml:`<div class="tenframe">${dots}</div><div class="tenlab">${total} נקודות</div>`,choices:shuffle(pairs).map(p=>({v:p[0]+"+"+p[1],label:p[0]+" + "+p[1],ok:(p[0]+p[1])===total})),answer:a+"+"+b}}
function makePoly(){const mode=pick(["name","sides","vertices"]);const shape=pick(POLY);const color=pick(COLORS);const svg=`<div class="polybox"><svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">${shape.svg(color)}</svg></div>`;if(mode==="name"){const opts=shuffle(POLY.map(p=>p.k)).slice(0,4);if(!opts.includes(shape.k))opts[0]=shape.k;return{prompt:"איזו צורה זאת?",speak:["q_poly"],stageHtml:svg,choices:shuffle(opts).map(k=>{const p=POLY.find(x=>x.k===k);return{v:k,label:p.name}}),answer:shape.k}}const ans=shape.sides;const wrong=shuffle([3,4,5,6,7,8].filter(n=>n!==ans)).slice(0,3);return{prompt:mode==="sides"?"כמה צלעות יש לצורה?":"כמה קדקדים יש לצורה?",speak:[mode==="sides"?"q_sides":"q_vertices"],stageHtml:svg,choices:shuffle([ans,...wrong]).map(n=>({v:n,label:String(n)})),answer:ans}}
function renderEx(){$("#exPrompt").textContent=exercise.prompt;$("#exStage").innerHTML=exercise.stageHtml;const box=$("#exChoices");const n=exercise.choices.length;box.className="choices"+(n===3?" row3":n===4?"":n>4?" row4":"");box.innerHTML=exercise.choices.map((c,i)=>`<button class="cbtn" type="button" data-i="${i}">${c.label}</button>`).join("");box.onclick=onChoice}
function onChoice(e){const b=e.target.closest(".cbtn");if(!b||answered)return;const c=exercise.choices[+b.dataset.i];const ok=(c.ok===true)||(c.v===exercise.answer);if(ok){answered=true;b.classList.add("ok");document.querySelectorAll("#exChoices .cbtn").forEach(x=>x.disabled=true);$("#exFb").className="fb on ok";$("#exFb").textContent="כל הכבוד! 🌟";$("#exActions").hidden=false;sayOk()}else{b.classList.add("bad");b.disabled=true;$("#exFb").className="fb on bad";$("#exFb").textContent="נסו שוב 🙂";sayBad();setTimeout(()=>{if(!answered){$("#exFb").className="fb";$("#exFb").textContent=""}},1000)}}
$("#btnMenu").onclick=()=>{stopSpeak();$("#helpPanel").classList.remove("on");show("sc-menu")};
$("#btnMore").onclick=()=>newExercise();
$("#btnNext").onclick=()=>{topicIdx=(topicIdx+1)%TOPICS.length;startTopic()};
$("#btnSpeak").onclick=()=>{if(exercise)speakKeys(exercise.speak);else speakKeys(["welcome"])};
$("#btnMute").onclick=function(){muted=!muted;this.setAttribute("aria-pressed",muted?"true":"false");this.textContent=muted?"🔇":"🔈";if(muted)stopSpeak()};
$("#btnHelp").onclick=()=>{const t=TOPICS[topicIdx];$("#helpTitle").textContent="עזרה";$("#helpH2").textContent=t.t;$("#helpBody").textContent=t.help;$("#helpPanel").classList.add("on");speakKeys([t.helpKey])};
$("#helpClose").onclick=()=>{$("#helpPanel").classList.remove("on");stopSpeak()};
buildMenu();
})();
</script>
</body>
</html>
