<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>מתמטיקה · א׳ תות</title>
<style>
@font-face{font-family:"Gveret Levin";src:url("fonts/GveretLevin-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
:root{--bg:#f5f4f0;--card:#fff;--ink:#1c2230;--navy:#1f3b5c;--mute:#667085;--line:#d9d6cc;--good:#2f8f4e;--r:14px;--letter-print:"Segoe UI","Arial Hebrew","Noto Sans Hebrew",Arial,sans-serif;--letter-cursive:"Gveret Levin",cursive;--letter:var(--letter-print)}
body.script-cursive{--letter:var(--letter-cursive)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100dvh;padding-bottom:28px}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}
.hw{max-width:560px;margin:0 auto;padding:8px 12px}
.hrow{display:flex;align-items:center;gap:8px;justify-content:space-between}
header h1{margin:0;font-size:16px;font-weight:750;flex:1;line-height:1.2;min-width:0}
header p{margin:2px 0 0;font-size:12.5px;opacity:.85}
.hbts{display:flex;gap:6px;flex:none;align-items:center}
.iconb{border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;border-radius:10px;min-width:44px;min-height:44px;font-size:18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:4px 8px;touch-action:manipulation}
.scriptb{border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.08);color:#fff;border-radius:12px;min-height:44px;padding:3px;cursor:pointer;display:inline-flex;align-items:stretch;gap:2px;touch-action:manipulation;line-height:1;flex:none}
.scriptb .seg{display:inline-flex;align-items:center;justify-content:center;min-width:40px;padding:0 6px;border-radius:9px;color:#fff;opacity:.7}
.scriptb .st-print{font:800 15px/1 var(--letter-print)}
.scriptb .st-cursive{font:400 19px/1 var(--letter-cursive)}
.scriptb .st-print,body.script-cursive .scriptb .st-cursive{background:#fff;color:var(--navy);opacity:1}
main{max-width:560px;margin:0 auto;padding:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:0 0 10px}
.startwrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding:28px 16px 20px;min-height:58dvh}
.startwrap h2{margin:0 0 6px;font-size:22px;font-weight:800;color:var(--navy)}
.startsub{margin:0 0 18px;font-size:15px;color:var(--mute);font-weight:600}
.ped-note{margin:0 0 14px;max-width:360px;font:500 12.5px/1.45 system-ui;color:var(--mute);text-align:center}
.game-menu{display:flex;flex-direction:column;gap:12px;margin:8px 0 4px;width:100%;max-width:360px}
.gbtn{display:flex;flex-direction:row;align-items:center;gap:12px;width:100%;min-height:72px;padding:12px 14px;border:2px solid var(--navy);border-radius:16px;background:#fff;color:var(--navy);font:800 20px/1.25 system-ui;text-align:right;cursor:pointer;touch-action:manipulation;text-decoration:none;box-shadow:0 3px 10px rgba(31,59,92,.1)}
.gbtn:active{transform:scale(.98)}
.gbtn .gstep{flex:none;width:28px;height:28px;border-radius:50%;background:#e8eef5;color:var(--navy);font:800 14px/1 system-ui;display:inline-flex;align-items:center;justify-content:center;border:1px solid #c5d0de}
.gbtn .gbody{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center}
.gbtn .gsub{display:block;margin-top:4px;font:600 13px/1.3 system-ui;color:var(--mute)}
.gbtn.pri{background:var(--good);border-color:var(--good);color:#fff;box-shadow:0 4px 14px rgba(47,143,78,.32)}
.gbtn.pri .gsub{color:rgba(255,255,255,.9)}
.gbtn.pri .gstep{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.45);color:#fff}
.priv{font-size:13px;color:var(--mute);text-align:center;margin:10px 0 0;line-height:1.35}
.foot{max-width:560px;margin:6px auto 0;padding:6px 12px;font-size:12px;color:var(--mute);text-align:center;line-height:1.45}
.stoast{position:fixed;top:64px;left:50%;transform:translateX(-50%) translateY(-8px);background:var(--navy);color:#fff;border-radius:999px;padding:8px 14px;font:700 14px system-ui;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;display:flex;gap:10px;align-items:center}
.stoast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.stoast .smp{font-family:var(--letter);font-size:18px}
@media (max-width:380px){
  .startwrap{padding:20px 12px 16px;min-height:52dvh}
  .gbtn{min-height:64px;font-size:18px}
}
</style>
</head>
<body>
<header><div class="hw">
  <div class="hrow">
    <h1>מתמטיקה · א׳ תות</h1>
    <div class="hbts">
      <button class="scriptb" id="btnScript" type="button" title="דפוס או כתב יד" aria-label="מעבר בין אותיות דפוס לכתב יד" aria-pressed="false"><span class="seg st-print" aria-hidden="true">אבג</span><span class="seg st-cursive" aria-hidden="true">אבג</span></button>
      <button class="iconb" id="btnSubjects" type="button" title="מקצועות" aria-label="חזרה לבחירת מקצוע">⌂</button>
    </div>
  </div>
  <p>בחרו משחק · בלי מיקרופון · בלי שמירת נתונים</p>
</div></header>
<main>
  <div class="card">
    <div class="startwrap">
      <h2 tabindex="-1">מה תרצו לתרגל?</h2>
      <p class="startsub">בחרו משחק · חיבור וחיסור</p>
      <p class="ped-note">המשחקים מסודרים לפי סדר פדגוגי — מהקל למתקדם</p>
      <div class="game-menu" role="list">
        <a class="gbtn pri" role="listitem" id="toAddsub" href="addsub/"><span class="gstep" aria-hidden="true">1</span><span class="gbody">חיבור וחיסור<span class="gsub">רואים נקודות · ממלאים עשר · עד 20</span></span></a>
      </div>
      <p class="priv">🔒 אין שמירת נתונים · אין עוגיות · הכל על המכשיר שלכם</p>
    </div>
  </div>
</main>
<div class="foot">A-TUT-MATH · א׳ תות<br>נבנה ע״י אשכול-בוט</div>
<script>
(function(){
"use strict";
const ATUT_PAGEPATH = '/a-tut/math/';
const GOATCOUNTER_URL = 'https://mipui-eshkol.goatcounter.com/count';
window.goatcounter = window.goatcounter || {};
window.goatcounter.path = function(){ return ATUT_PAGEPATH; };
const Stats=(()=>{const q=[];let ready=false;
 function init(){if(!GOATCOUNTER_URL)return;const s=document.createElement('script');s.async=true;s.src='https://gc.zgo.at/count.js';
  s.setAttribute('data-goatcounter',GOATCOUNTER_URL);s.onload=()=>{ready=true;q.splice(0).forEach(fn=>fn())};document.head.appendChild(s);
  try{trackReturn()}catch(e){}}
 function run(fn){if(!GOATCOUNTER_URL)return;ready?fn():q.push(fn)}
 function send(n,isEvent){try{window.goatcounter&&window.goatcounter.count&&window.goatcounter.count({path:n,title:n,event:!!isEvent})}catch(e){}}
 function ev(n){run(()=>send(n,true))}
 function page(n){run(()=>send(n,false))}
 function bucket(n){return n<=3?String(n):n<=5?'4-5':n<=10?'6-10':'11+'}
 function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
 function trackReturn(){
  const KEY='atut_anon_v1';
  let raw=null;try{raw=localStorage.getItem(KEY)}catch(e){return}
  let data=null;try{data=raw?JSON.parse(raw):null}catch(e){data=null}
  const day=today();
  const isNew=!data||typeof data!=='object'||!data.id;
  if(isNew){
   const id=(crypto.randomUUID?crypto.randomUUID():('x'+Math.random().toString(36).slice(2)+Date.now()));
   data={id,n:1,first:day,lastDay:day};
   ev('a-tut/new-device');ev('a-tut/visit-n/'+bucket(1));
  }else if(data.lastDay!==day){
   data.n=(Number(data.n)||0)+1;data.lastDay=day;if(!data.first)data.first=day;
   ev('a-tut/returning-device');ev('a-tut/visit-n/'+bucket(data.n));
  }
  try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}
 }
 return {init,ev,page}})();
function showScriptToast(cursive){
  let t=document.getElementById("scriptToast");
  if(!t){t=document.createElement("div");t.id="scriptToast";t.className="stoast";t.setAttribute("role","status");t.setAttribute("aria-live","polite");document.body.appendChild(t);}
  t.innerHTML=cursive?'<span>עכשיו: כתב יד</span><span class="smp">אבג</span>':'<span>עכשיו: דפוס</span><span class="smp">אבג</span>';
  t.classList.add("on");
  clearTimeout(showScriptToast._t);
  showScriptToast._t=setTimeout(()=>t.classList.remove("on"),1500);
}
function isCursive(){return document.body.classList.contains("script-cursive")}
function applyScript(cursive){
  document.body.classList.toggle("script-cursive", !!cursive);
  const b=document.getElementById("btnScript");
  if(b){
    b.setAttribute("aria-pressed", cursive?"true":"false");
    b.title = cursive ? "כתב יד פעיל · לחצו לדפוס" : "דפוס פעיל · לחצו לכתב יד";
  }
}
function withScript(href){
  if(!isCursive()) return href;
  if(!href||href.indexOf("script=")>=0) return href;
  return href + (href.indexOf("?")>=0 ? "&" : "?") + "script=cursive";
}
const params=new URLSearchParams(location.search);
applyScript(params.get("script")==="cursive");
function refreshLinks(){
  const a=document.getElementById("toAddsub");
  if(a) a.href=withScript("addsub/");
}
document.getElementById("btnScript").onclick=()=>{
  const next=!isCursive();
  applyScript(next);
  showScriptToast(next);
  refreshLinks();
  try{
    const u=new URL(location.href);
    if(next) u.searchParams.set("script","cursive"); else u.searchParams.delete("script");
    history.replaceState(null,"",u.pathname+u.search+u.hash);
  }catch(e){}
};
refreshLinks();
document.getElementById("btnSubjects").onclick=()=>{ location.href=withScript("../"); };
try{Stats.init()}catch(e){}
})();
</script>
</body>
</html>
