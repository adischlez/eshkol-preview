<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>A-TUT-LANG-01 · שפה · א׳ תות</title>
<style>
:root{--bg:#f5f4f0;--card:#fff;--ink:#1c2230;--navy:#1f3b5c;--mute:#667085;--line:#d9d6cc;--blue:#3a78c2;--org:#e8862a;--good:#2f8f4e;--warn:#d98a1c;--bad:#d9534f;--hl:#fff4dc;--pond1:#d8e8f2;--pond2:#b9d4e8;--pond3:#8fb8d6;--r:14px;--vvt:0px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:28px;min-height:100dvh}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}
.hw{max-width:980px;margin:0 auto;padding:8px 12px}
.hrow{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;justify-content:space-between}
header h1{margin:0;font-size:17px;font-weight:750;flex:1;min-width:0;line-height:1.2}
header p{margin:2px 0 0;font-size:12.5px;opacity:.85}
.iconb{border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;border-radius:8px;min-width:36px;min-height:32px;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:3px 7px}
.iconb[aria-pressed=true]{background:#fff;color:var(--navy);border-color:#fff}
.hbts{display:flex;gap:5px;flex:none}
body.ex header p{display:none}
main{max-width:980px;margin:0 auto;padding:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;margin:0 0 10px}
.card h2,#start h2{margin:2px 0 8px;font-size:18px;font-weight:750}
.ecq{font-weight:700;margin:12px 0 6px}
.btn.pri.qk,.qk{display:flex;flex-direction:column;align-items:center;width:100%;min-height:64px;gap:2px;font-size:18px;margin:0 0 4px;flex:none}
.qk small{font-size:13px;font-weight:400;opacity:.9}
.tgrid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:6px}
.tgrid .btn,.tgrid .tbtn{min-height:48px;font-size:15px;font-weight:700;text-align:right;padding:10px 12px;color:var(--ink);background:#fff;border:1px solid var(--ink);border-radius:12px;width:100%;cursor:pointer}
.tgrid .btn .subline,.tgrid .tbtn .subline{display:block;font-weight:500;color:var(--mute);font-size:12.5px;margin-top:2px}
.tbtn{border:1px solid var(--ink);background:#fff;border-radius:12px;padding:10px 12px;text-align:right;cursor:pointer;font:700 15px system-ui;color:var(--ink);min-height:48px;width:100%}
.rem.tk{position:sticky;top:var(--vvt);z-index:6;font-size:13px;font-weight:600;background:#fff3e2;margin:0 -4px 4px;padding:4px 8px;box-shadow:0 2px 5px rgba(31,59,92,.16);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rem.tk .ttl{flex:1;min-width:0;color:var(--navy)}
.info{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--navy);color:#fff;border-radius:999px;padding:3px 10px 3px 5px;min-height:38px;font:700 13px system-ui;cursor:pointer}
.info .ic{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:#fff;color:var(--navy);font:italic 800 16px Georgia,serif}
.prompt{font-size:17px;font-weight:750;color:var(--navy);margin:0 0 8px;text-align:center;line-height:1.3}
.stage{min-height:0;display:flex;align-items:center;justify-content:center;margin:0 0 6px}
.stage-inner{width:100%;text-align:center}
.fb{border-radius:8px;padding:6px 10px;font-weight:700;text-align:center;font-size:14px;display:none;margin:6px 0}
.fb.on{display:block}.fb.ok{background:#eef8f1;color:#1f6b38}.fb.bad{background:#fff6e8;color:#8a5200}
.endbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.endbtns .btn{min-height:48px;font-size:16px}
.endbtns[hidden]{display:none!important}
.btn{border:1px solid var(--ink);background:#fff;color:var(--ink);border-radius:12px;padding:7px 14px;min-height:42px;font:700 14.5px system-ui;cursor:pointer;flex:1;min-width:120px}
.btn.pri{background:var(--good);border-color:var(--good);color:#fff}
.btn.sm{min-width:0;min-height:44px;font-size:15px;padding:8px 12px}
.priv{font-size:12px;color:var(--mute);text-align:center;margin:10px 0 0;line-height:1.35}
.foot{max-width:980px;margin:6px auto 0;padding:4px 12px;font-size:10px;color:var(--mute);text-align:center;opacity:.9;line-height:1.4}
.explain{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;display:none}
.explain.on{display:block}
.xbar{position:sticky;top:0;background:rgba(245,244,240,.96);border-bottom:1px solid var(--line);padding:8px 12px;z-index:2;display:flex;gap:8px;align-items:center}
.xin{max-width:820px;margin:0 auto;padding:14px 16px 28px}
.xin h2{font-size:20px;color:var(--navy);margin:0 0 10px}
.idea{background:#eef4fb;border-radius:10px;padding:12px 14px;font-size:16px;font-weight:600;color:var(--navy)}
.screen{display:none}.screen.on{display:block}
.lvrow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:0 0 8px}
.lvbtn{border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:999px;min-height:36px;padding:4px 12px;font:700 13px system-ui;cursor:pointer}
.lvbtn.on{background:var(--navy);color:#fff}
.azbar,.gamebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px;flex-wrap:wrap}
.azprog,.gprog{font:700 15px system-ui;color:var(--navy)}
.azrep,.greplay{border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:999px;min-height:40px;min-width:40px;padding:4px 12px;font:700 14px system-ui;cursor:pointer}
.azgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%;max-width:420px;margin:0 auto}
.azcell{border:1.5px solid var(--ink);background:#fff;border-radius:12px;min-height:48px;font:800 26px "Times New Roman",serif;color:var(--ink);cursor:pointer;padding:4px;touch-action:manipulation;line-height:1}
.azcell.done{background:#eef8f1;border-color:#9fd4b2;color:#7a8a7e;opacity:.55;cursor:default}
.azcell.bad{animation:nudge .35s;background:#fff6e8;border-color:var(--warn)}
.azcell.hint{box-shadow:0 0 0 3px var(--org);border-color:var(--org)}
.azceleb{text-align:center;padding:12px 8px}.azceleb .stars{font-size:36px;margin:4px 0}
.azceleb h3{margin:4px 0 10px;color:var(--good);font-size:20px}
@keyframes nudge{0%,100%{transform:none}30%{transform:translateX(-4px)}70%{transform:translateX(4px)}}
/* pond / fish */
.pondwrap{position:relative;width:100%;max-width:520px;margin:0 auto;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,var(--pond1) 0%,var(--pond2) 55%,var(--pond3) 100%);height:210px}
.pondbucket{position:absolute;left:8px;bottom:8px;z-index:3;display:flex;flex-direction:column;align-items:center;gap:2px}
.pondbucket .bk{width:52px;height:40px;border:2px solid var(--navy);border-bottom-width:3px;border-radius:0 0 10px 10px;background:rgba(255,255,255,.55);display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:1px;padding:2px;font:800 11px "Times New Roman",serif;color:var(--navy)}
.pondbucket .lbl{font:700 11px system-ui;color:var(--navy)}
.fish{position:absolute;min-width:56px;min-height:56px;border:0;border-radius:50% 40% 50% 40%;background:#fff;box-shadow:0 2px 6px rgba(31,59,92,.18);font:800 26px/1 "Times New Roman",serif;color:var(--navy);cursor:pointer;touch-action:manipulation;padding:0 10px;z-index:2}
.fish::after{content:"";position:absolute;left:-10px;top:50%;width:0;height:0;border:10px solid transparent;border-right-color:#fff;transform:translateY(-50%);filter:drop-shadow(-1px 0 0 rgba(31,59,92,.15))}
.fish.caught{opacity:0;pointer-events:none;transition:opacity .35s,transform .35s}
.fish.flee{animation:flee .7s ease-in forwards}
@keyframes flee{to{transform:translateX(-140%) scale(.85);opacity:0}}
@keyframes swim{0%,100%{transform:translateX(0)}50%{transform:translateX(12px)}}
@keyframes swimL{0%,100%{transform:translateX(0)}50%{transform:translateX(-12px)}}
.fish.s0{animation:swim 5.5s ease-in-out infinite}
.fish.s1{animation:swimL 6.5s ease-in-out infinite}
.fish.s2{animation:swim 7.2s ease-in-out infinite}
.fish.s3{animation:swimL 5.8s ease-in-out infinite}
.fish.s4{animation:swim 6.8s ease-in-out infinite}
.fish.s5{animation:swimL 7.8s ease-in-out infinite}
.fish.s6{animation:swim 5.2s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){
  .fish,.fish.s0,.fish.s1,.fish.s2,.fish.s3,.fish.s4,.fish.s5,.fish.s6{animation:none!important}
  .fish.flee{animation:none;opacity:0}
}
/* train */
.traintrack{width:100%;max-width:560px;margin:0 auto 8px;padding:8px 4px 4px;background:linear-gradient(180deg,#eef2f6,#e4e9ef);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.trainrow{display:flex;flex-direction:row;direction:rtl;align-items:stretch;justify-content:center;gap:4px;min-height:72px}
.wagon{flex:1;min-width:44px;max-width:72px;min-height:64px;border:2px solid var(--navy);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font:800 28px/1 "Times New Roman",serif;color:var(--navy);position:relative}
.wagon.empty{border-style:dashed;background:#fffdf6;color:var(--mute);box-shadow:inset 0 0 0 2px var(--hl)}
.wagon.empty.on{box-shadow:0 0 0 3px var(--org);border-color:var(--org)}
.wagon.ok{background:#eef8f1;border-color:var(--good)}
.wagon .wh{position:absolute;bottom:-7px;width:10px;height:10px;border-radius:50%;background:var(--navy);left:8px}
.wagon .wh2{position:absolute;bottom:-7px;width:10px;height:10px;border-radius:50%;background:var(--navy);right:8px}
.engine{flex:0 0 48px;min-height:64px;border-radius:14px 10px 10px 10px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;transform:scaleX(-1)}
.cardrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0 4px}
.tcard{min-width:56px;min-height:56px;border:2px solid var(--ink);border-radius:12px;background:#fff;font:800 28px "Times New Roman",serif;color:var(--ink);cursor:pointer;touch-action:manipulation;padding:6px 12px}
.tcard.sel{box-shadow:0 0 0 3px var(--org);border-color:var(--org)}
.tcard.used{opacity:.35;pointer-events:none}
.tcard.dragging{opacity:.5}
.hintline{font-size:12.5px;color:var(--mute);text-align:center;margin:0 0 4px}
@media(min-width:600px){
  .tgrid{grid-template-columns:1fr 1fr;gap:6px}
  .azgrid{grid-template-columns:repeat(6,1fr);max-width:520px}
  .azcell{min-height:56px;font-size:30px}
  .pondwrap{height:240px}
  .fish{min-width:64px;min-height:64px;font-size:30px}
}
@media(max-width:400px){
  body{padding-bottom:8px}
  .btn.pri.qk,.qk{min-height:48px;font-size:15px;padding:6px 10px;margin:0 0 2px}
  .qk small{font-size:11px}
  .tgrid{gap:4px;margin-top:4px}
  .tgrid .btn,.tgrid .tbtn{min-height:40px;padding:6px 8px;font-size:13.5px}
  .tgrid .btn .subline,.tgrid .tbtn .subline{font-size:11px;margin-top:0}
  #start h2,.card h2{font-size:15.5px;margin:0 0 4px}
  .ecq{margin:6px 0 2px;font-size:14px}
  .priv{font-size:10.5px;margin:4px 0 0}
  .card{padding:6px 8px;margin:0 0 6px}
  main{padding:6px}
  .foot{font-size:9px;padding:0 8px;margin:2px auto 0}
  header p{display:none}
  .hw{padding:6px 10px}
  header h1{font-size:15.5px}
  .azgrid{gap:5px}.azcell{min-height:44px;font-size:22px}
  .pondwrap{height:180px}
  .fish{min-width:56px;min-height:56px;font-size:22px}
  .wagon{min-height:56px;font-size:22px;min-width:40px}
  .tcard{min-width:56px;min-height:56px;font-size:24px}
  .prompt{font-size:15px;margin:0 0 6px}
}
</style>
</head>
<body>
<header><div class="hw">
  <div class="hrow">
    <h1>שפה · א׳ תות</h1>
    <div class="hbts">
      <button class="iconb" id="btnMenu" type="button" title="תפריט" aria-label="חזרה לתפריט">☰</button>
      <button class="iconb" id="btnSpeak" type="button" title="השמעה" aria-label="השמעה">🔊</button>
      <button class="iconb" id="btnMute" type="button" title="השתקה" aria-label="השתקה" aria-pressed="false">🔈</button>
    </div>
  </div>
  <p>מצאו את האות · בלי מיקרופון · בלי שמירת נתונים</p>
</div></header>
<main>
  <section class="screen on" id="sc-menu">
    <div class="card endsc" id="start">
      <h2 tabindex="-1">איך מתרגלים היום?</h2>
      <button class="btn pri qk" id="btnQuick" type="button"><b>בואו נתחיל ←</b><small>מצאו את האות · 22 אותיות</small></button>
      <p class="ecq">או לפתוח מהתפריט:</p>
      <div class="tgrid sgrid" id="topicList"></div>
      <p class="priv">🔒 אין שמירת נתונים · אין עוגיות · הכל על המכשיר שלכם</p>
    </div>
  </section>
  <section class="screen" id="sc-ex">
    <div class="rem tk" id="taskLine">
      <span class="ttl" id="exTopic"></span>
      <button class="info" id="btnHelp" type="button"><span class="ic">?</span>עזרה</button>
    </div>
    <div class="card" id="exCard">
      <p class="prompt" id="exPrompt"></p>
      <div class="stage"><div class="stage-inner" id="exStage"></div></div>
      <div id="exChoices"></div>
      <div class="fb" id="exFb"></div>
      <div class="endbtns" id="exActions" hidden>
        <button class="btn pri" id="btnMore" type="button">עוד סיבוב</button>
        <button class="btn" id="btnNext" type="button">למשחק הבא ←</button>
      </div>
    </div>
  </section>
</main>
<div class="explain" id="helpPanel" role="dialog" aria-modal="true">
  <div class="xbar">
    <button class="btn sm" id="helpClose" type="button">→ חזור</button>
    <strong id="helpTitle" style="flex:1;color:var(--navy)">עזרה</strong>
  </div>
  <div class="xin"><h2 id="helpH2"></h2><div class="idea" id="helpBody"></div></div>
</div>
<div class="foot">A-TUT-LANG-01 · טיוטה · א׳ תות · לא לפרסום<br>נבנה ע״י אשכול-בוט</div>
