<!doctype html>
<html lang="he" dir="rtl">
<head>

<style>
:root{--bg:#f5f4f0;--card:#fff;--ink:#1c2230;--navy:#1f3b5c;--mute:#667085;--line:#d9d6cc;--blue:#3a78c2;--org:#e8862a;--good:#2f8f4e;--warn:#d98a1c;--bad:#d9534f;--hl:#fff4dc;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-text-size-adjust:100%;overflow:hidden}
body{display:flex;flex-direction:column;max-height:100dvh}
header{background:var(--navy);color:#fff;flex:none;z-index:20}
.hw{max-width:980px;margin:0 auto;padding:8px 12px;display:flex;align-items:center;gap:8px}
header h1{margin:0;font-size:16px;font-weight:750;flex:1;min-width:0;line-height:1.2}
header h1 small{display:block;font-weight:500;opacity:.85;font-size:11px;margin-top:1px}
.iconb{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:10px;width:40px;height:40px;font-size:18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none;padding:0}
.iconb[aria-pressed=true]{background:#fff;color:var(--navy)}
main{flex:1;min-height:0;max-width:980px;width:100%;margin:0 auto;padding:8px 10px;display:flex;flex-direction:column;overflow:hidden}
.screen{display:none;flex:1;min-height:0;flex-direction:column;overflow:hidden}
.screen.on{display:flex}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;min-height:0;flex:1;overflow:hidden}
.card h2{margin:0 0 4px;font-size:17px;color:var(--ink);font-weight:750}
.sub{color:var(--mute);font-size:12.5px;margin:0 0 8px}
.topics{display:grid;gap:7px;grid-template-columns:1fr;overflow:auto;min-height:0;-webkit-overflow-scrolling:touch}
.tbtn{border:1px solid var(--ink);background:#fff;border-radius:12px;padding:10px 12px;text-align:right;cursor:pointer;font:700 15px system-ui,-apple-system,sans-serif;color:var(--ink);min-height:48px;display:flex;align-items:center;gap:10px}
.tbtn .n{font-size:20px;font-weight:800;color:var(--org);width:28px;flex:none;font-family:"Times New Roman",serif;text-align:center}
.tbtn .meta{flex:1;min-width:0}.tbtn .meta small{display:block;font-weight:500;color:var(--mute);font-size:11.5px;margin-top:1px}
.exwrap{display:flex;flex-direction:column;flex:1;min-height:0;gap:6px}
.toprow{display:flex;align-items:center;gap:8px;flex:none}
.toprow .ttl{flex:1;font-weight:750;color:var(--navy);font-size:14.5px;min-width:0}
.info{display:inline-flex;align-items:center;gap:5px;border:0;background:var(--navy);color:#fff;border-radius:999px;padding:4px 10px 4px 5px;min-height:32px;font:700 12px system-ui;cursor:pointer;flex:none}
.info .ic{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#fff;color:var(--navy);font:italic 800 14px Georgia,serif}
.prompt{font-size:16px;font-weight:750;color:var(--navy);margin:0;text-align:center;flex:none;line-height:1.25}
.stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage-inner{width:100%;max-height:100%;text-align:center}
.bigletter{font:800 72px/1 "Times New Roman",serif;color:var(--navy);margin:0}
.picem{font-size:48px;line-height:1}
.picw{font-size:22px;font-weight:800;margin-top:4px}
.note{font-size:12px;color:var(--mute);margin-top:4px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:7px;flex:none}
.picgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;flex:none}
.cbtn{border:1.5px solid var(--ink);background:#fff;border-radius:12px;min-height:52px;font:800 30px "Times New Roman",serif;color:var(--ink);cursor:pointer;padding:6px 4px;touch-action:manipulation}
.pic{border:1.5px solid var(--ink);background:#fff;border-radius:12px;padding:8px 4px;cursor:pointer;min-height:72px;font:700 13px system-ui;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.pic .em{font-size:32px;line-height:1}.pic .w{font-size:14px;font-weight:700}
.cbtn:disabled,.pic:disabled{opacity:.55;cursor:default}
.cbtn.ok,.pic.ok{background:#eef8f1;border-color:var(--good);color:var(--good)}
.cbtn.bad,.pic.bad{background:#fff6e8;border-color:var(--warn);color:var(--warn);animation:nudge .35s}
@keyframes nudge{0%,100%{transform:none}30%{transform:translateX(-4px)}70%{transform:translateX(4px)}}
.fb{flex:none;border-radius:8px;padding:5px 8px;font-weight:700;text-align:center;font-size:13px;display:none}
.fb.on{display:block}
.fb.ok{background:#eef8f1;color:#1f6b38}
.fb.bad{background:#fff6e8;color:#8a5200}
.endbtns{display:flex;flex-wrap:nowrap;gap:7px;flex:none}
.endbtns[hidden]{display:none!important}
.btn{border:1px solid var(--ink);background:#fff;color:var(--ink);border-radius:12px;padding:8px 12px;min-height:42px;font:700 14px system-ui,-apple-system,sans-serif;cursor:pointer;flex:1;min-width:0}
.btn.pri{background:var(--good);border-color:var(--good);color:#fff}
.priv{font-size:11px;color:var(--mute);text-align:center;margin:6px 0 0;flex:none}
.foot{flex:none;background:rgba(245,244,240,.97);border-top:1px solid var(--line);padding:4px 10px;font-size:10px;color:var(--mute);text-align:center}
.explain{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;display:none}
.explain.on{display:block}
.xbar{position:sticky;top:0;background:rgba(245,244,240,.96);border-bottom:1px solid var(--line);padding:8px 12px;z-index:2;display:flex;gap:8px;align-items:center}
.xin{max-width:820px;margin:0 auto;padding:12px 14px 24px}
.xin h2{font-size:18px;color:var(--navy);margin:0 0 8px}
.idea{background:#eef4fb;border-radius:10px;padding:10px 12px;font-size:14.5px;font-weight:600;color:var(--navy)}
@media(min-width:600px){
  header h1{font-size:18px}.cbtn{min-height:60px;font-size:36px}.bigletter{font-size:96px}
  .picem{font-size:64px}.topics{grid-template-columns:1fr 1fr}.pic{min-height:90px}
}
@media(max-height:700px){
  .bigletter{font-size:52px}.cbtn{min-height:44px;font-size:26px}.picem{font-size:36px}
  .pic{min-height:60px}.pic .em{font-size:26px}.picw{font-size:18px}.prompt{font-size:14.5px}
  .card{padding:8px 10px}.btn{min-height:38px;font-size:13px}
}
</style>

<body>
<header><div class="hw">
  <button class="iconb" id="btnMenu" type="button" title="תפריט" aria-label="חזרה לתפריט">☰</button>
  <h1>שפה · א׳ תות <small>בית ספר אשכולות · אותיות וצלילים</small></h1>
  <button class="iconb" id="btnSpeak" type="button" title="השמעה" aria-label="השמעה">🔊</button>
  <button class="iconb" id="btnMute" type="button" title="השתקה" aria-label="השתקה" aria-pressed="false">🔈</button>
</div></header>
<main>
  <section class="screen on" id="sc-menu">
    <div class="card">
      <h2>מה תרצו לתרגל?</h2>
      <p class="sub">לוחצים על אות או על תמונה. המכשיר מקריא בקול. בלי מיקרופון.</p>
      <div class="topics" id="topicList"></div>
      <p class="priv">🔒 אין שמירת נתונים · אין עוגיות · הכל על המכשיר שלכם</p>
    </div>
  </section>
  <section class="screen" id="sc-ex">
    <div class="card">
      <div class="exwrap">
        <div class="toprow">
          <div class="ttl" id="exTopic"></div>
          <button class="info" id="btnHelp" type="button"><span class="ic">?</span>עזרה</button>
        </div>
        <p class="prompt" id="exPrompt"></p>
        <div class="stage"><div class="stage-inner" id="exStage"></div></div>
        <div id="exChoices"></div>
        <div class="fb" id="exFb"></div>
        <div class="endbtns" id="exActions" hidden>
          <button class="btn pri" id="btnMore" type="button">עוד תרגיל</button>
          <button class="btn" id="btnNext" type="button">לנושא הבא ←</button>
        </div>
      </div>
    </div>
  </section>
</main>
<div class="explain" id="helpPanel" role="dialog" aria-modal="true">
  <div class="xbar">
    <button class="btn" id="helpClose" type="button">חזרה ←</button>
    <strong id="helpTitle" style="flex:1;color:var(--navy)">עזרה</strong>
  </div>
  <div class="xin"><h2 id="helpH2"></h2><div class="idea" id="helpBody"></div></div>
</div>
<div class="foot">A-TUT-LANG-01 · תצוגה מקדימה · לא לשימוש ציבורי</div>
<script>
(function(){
"use strict";
const AUDIO="audio/";
/* Letters. Note: soft כ and ח sound alike — never ask to pick between them by ear. */
const LETTERS={
  d:{ch:"ד",snd:"snd_d",pics:[
    {em:"🐟",w:"דָּג",key:"w_dag"},{em:"🚪",w:"דֶּלֶת",key:"w_delet"},{em:"🍯",w:"דְּבַשׁ",key:"w_dvash"}]},
  h:{ch:"ח",snd:"snd_h",pics:[
    {em:"🥛",w:"חָלָב",key:"w_chalav"},{em:"🏖️",w:"חוֹל",key:"w_chol"},{em:"🐱",w:"חָתוּל",key:"w_chatul"}]},
  s:{ch:"ס",snd:"snd_s",pics:[
    {em:"📚",w:"סֵפֶר",key:"w_sefer"},{em:"🐴",w:"סוּס",key:"w_sus"},{em:"🧺",w:"סַל",key:"w_sal"}]},
  kh:{ch:"כּ",snd:"snd_k_hard",pics:[
    {em:"🐶",w:"כֶּלֶב",key:"w_kelev"},{em:"⚽",w:"כַּדּוּר",key:"w_kadur"},{em:"⭐",w:"כּוֹכָב",key:"w_kokhav"}]}
};
const DISTRACTOR_PICS=[
  {em:"✋",w:"יָד",key:"w_yad"},{em:"🏠",w:"בַּיִת",key:"w_bayit"},
  {em:"🌸",w:"פֶּרַח",key:"w_perach"},{em:"☀️",w:"שֶׁמֶשׁ",key:"w_shemesh"}
];
/* For sound/hearing tasks: never put כ and ח together as options */
const HEAR_POOL=["ד","ס","כּ","ב","מ","ר","ת","א","ש"]; /* no soft כ, no ח */
const VISUAL_POOL=["ד","ח","ס","כּ","כ","ב","מ","ר"]; /* may include soft כ and ח for shape tasks */
const TOPICS=[
  {k:"d",t:"האות ד׳",em:"ד",help:"הקשיבו לצליל דַּ. לחצו על האות או על התמונה שמתחילה בד׳.",speak:"t_d",letter:"d"},
  {k:"h",t:"האות ח׳",em:"ח",help:"הקשיבו לצליל חַ. לחצו על האות או על התמונה שמתחילה בח׳.",speak:"t_h",letter:"h"},
  {k:"s",t:"האות ס׳",em:"ס",help:"הקשיבו לצליל סַ. לחצו על האות או על התמונה שמתחילה בס׳.",speak:"t_s",letter:"s"},
  {k:"k",t:"האות כ / כּ",em:"כּ",help:"מסתכלים על הצורה בלבד: כּ עם נקודה בפנים, כ בלי נקודה. כ רכה ו־ח נשמעות דומה — לכן לא מבקשים להבחין ביניהן רק באוזן.",speak:"t_k",letter:"k"},
  {k:"sounds",t:"צלילים ואותיות",em:"א",help:"אמרו את שם התמונה בקול. איזו אות שומעים בהתחלה?",speak:"t_sounds",letter:null}
];
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function shuffle(a){const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function letterChoices(correctCh, n, pool){
  const p=pool.filter(c=>c!==correctCh);
  return shuffle([correctCh,...shuffle(p).slice(0,n-1)]);
}
/* When correct is ח, exclude כ from hear options; when correct is soft-related, use visual only */
function hearChoicesFor(ch){
  // soft כ never used as hear-target; ח uses HEAR_POOL without needing כ
  if(ch==="ח") return letterChoices("ח",4,["ח","ד","ס","כּ","ב","מ","ר","ת"]); // has ח, no soft כ
  if(ch==="כּ") return letterChoices("כּ",4,HEAR_POOL); // hard kaf vs others, no soft כ, no ח
  return letterChoices(ch,4,HEAR_POOL.concat(["ח"]).filter(c=>c!=="כ")); // others ok with ח, no soft כ
}
let muted=false,currentAudio=null,topicIdx=0,exercise=null,answered=false;
const $=s=>document.querySelector(s);
function stopSpeak(){if(currentAudio){try{currentAudio.pause();currentAudio.src=""}catch(e){}currentAudio=null}if(window.speechSynthesis)speechSynthesis.cancel()}
function speakKeys(keys){if(muted)return;stopSpeak();const list=(Array.isArray(keys)?keys:[keys]).filter(Boolean);playSeq(list,0)}
function playSeq(list,i){if(i>=list.length)return;const key=list[i];const a=new Audio(AUDIO+key+".mp3");currentAudio=a;a.onended=()=>playSeq(list,i+1);a.onerror=()=>fallbackSay(key,()=>playSeq(list,i+1));a.play().catch(()=>fallbackSay(key,()=>playSeq(list,i+1)))}
function fallbackSay(key,done){if(!window.speechSynthesis){done&&done();return}
  const map={ok:"כל הכבוד!",ok2:"נכון מאוד!",ok3:"יפה מאוד!",try:"לא נורא. נסו עוד פעם.",almost:"כמעט! נסו שוב.",
    q_which_letter:"איזו אות זאת?",q_find_letter:"לחצו על האות",q_initial:"במה פותחת המילה? לחצו על האות",
    q_sound:"איזה צליל שומעים? לחצו על האות",q_match_pic:"איזו תמונה מתחילה בצליל של האות?",
    q_look:"הסתכלו על האות. לחצו על הצורה הנכונה",
    snd_d:"דַ",snd_h:"חַ",snd_s:"סַ",snd_k_hard:"כַּ",
    w_dag:"דג",w_delet:"דלת",w_dvash:"דבש",w_chalav:"חלב",w_chol:"חול",w_chatul:"חתול",
    w_sefer:"ספר",w_sus:"סוס",w_sal:"סל",w_kelev:"כלב",w_kadur:"כדור",w_kokhav:"כוכב",
    w_yad:"יד",w_bayit:"בית",w_perach:"פרח",w_shemesh:"שמש",
    t_d:"האות דלת",t_h:"האות חית",t_s:"האות סמך",t_k:"האות כף",t_sounds:"צלילים ואותיות",
    help_letter:"הקשיבו לצליל. לחצו על האות הנכונה.",help_initial:"אמרו את שם התמונה בקול.",help_k:"מסתכלים על הדגש באות כף."};
  const t=map[key];if(!t){done&&done();return}const u=new SpeechSynthesisUtterance(t);u.lang="he-IL";u.rate=.9;u.onend=()=>done&&done();u.onerror=()=>done&&done();speechSynthesis.speak(u)}
function sayOk(){speakKeys(pick(["ok","ok2","ok3"]))}function sayBad(){speakKeys(pick(["try","almost"]))}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));$("#"+id).classList.add("on")}
function buildMenu(){$("#topicList").innerHTML=TOPICS.map((t,i)=>`<button class="tbtn" type="button" data-i="${i}"><span class="n">${t.em}</span><span class="meta">${t.t}<small>עם הקראה בקול</small></span></button>`).join("");$("#topicList").onclick=e=>{const b=e.target.closest(".tbtn");if(!b)return;topicIdx=+b.dataset.i;startTopic()}}
function startTopic(){answered=false;show("sc-ex");$("#exTopic").textContent=TOPICS[topicIdx].t;$("#exActions").hidden=true;$("#exFb").className="fb";newExercise()}
function newExercise(){answered=false;stopSpeak();$("#exActions").hidden=true;$("#exFb").className="fb";$("#exFb").textContent="";const t=TOPICS[topicIdx];if(t.k==="sounds")exercise=makeSoundsMix();else if(t.k==="k")exercise=makeKaf();else exercise=makeLetter(t.letter);renderEx();setTimeout(()=>speakKeys(exercise.speak),150)}

function makeLetter(lk){
  const L=LETTERS[lk];
  const mode=pick(["identify","find","initial","matchpic"]);
  // identify/find: letter is shown → visual; still ok to hear sound as support
  if(mode==="identify"){
    // letter is shown → visual task; options never force soft כ vs ח by ear alone
    const opts=hearChoicesFor(L.ch);
    return{prompt:"איזו אות זאת?",speak:["q_which_letter",L.snd],stageHtml:`<div class="bigletter">${L.ch}</div><p class="note">הקשיבו לצליל</p>`,kind:"letters",choices:opts.map(ch=>({v:ch,label:ch})),answer:L.ch};
  }
  if(mode==="find"){
    return{prompt:"לחצו על האות "+L.ch,speak:["q_find_letter",L.snd],stageHtml:`<div class="bigletter" style="color:var(--mute);font-size:48px">?</div>`,kind:"letters",choices:hearChoicesFor(L.ch).map(ch=>({v:ch,label:ch})),answer:L.ch};
  }
  if(mode==="initial"){
    const pic=pick(L.pics);
    // initial sound: hear the word — options must not force כ vs ח
    return{prompt:"במה פותחת המילה? לחצו על האות",speak:["q_initial",pic.key],stageHtml:`<div class="picem">${pic.em}</div><div class="picw">${pic.w}</div>`,kind:"letters",choices:hearChoicesFor(L.ch).map(ch=>({v:ch,label:ch})),answer:L.ch};
  }
  const good=pick(L.pics);
  const bads=shuffle(DISTRACTOR_PICS.concat(Object.keys(LETTERS).filter(k=>k!==lk).map(k=>pick(LETTERS[k].pics)))).slice(0,3);
  return{prompt:"איזו תמונה מתחילה בצליל של האות?",speak:["q_match_pic",L.snd],stageHtml:`<div class="bigletter">${L.ch}</div>`,kind:"pics",choices:shuffle([good,...bads]).slice(0,4).map(p=>({v:p.key,label:p.w,em:p.em,ok:p.key===good.key})),answer:good.key};
}

function makeKaf(){
  /* Soft כ vs ח: VISUAL only (dagesh / shape). Hard כּ can use sound vs other letters (not ח). */
  const mode=pick(["look_dagesh","hard_id","hard_pic","hard_sound"]);
  if(mode==="look_dagesh"){
    const hard=Math.random()<.5;
    return{
      prompt:hard?"לחצו על כּ עם דגש":"לחצו על כ בלי דגש",
      speak:["q_look"], // no letter-sound that would confuse with ח
      stageHtml:`<p class="note">${hard?"מחפשים את הנקודה בתוך האות":"מחפשים אות בלי נקודה בפנים"}</p><div class="bigletter" style="font-size:40px;color:var(--mute)">?</div>`,
      kind:"letters",
      choices:shuffle([{v:"כּ",label:"כּ"},{v:"כ",label:"כ"},{v:"ח",label:"ח"},{v:"ד",label:"ד"}]),
      answer:hard?"כּ":"כ"
    };
  }
  if(mode==="hard_pic"){
    const pic=pick(LETTERS.kh.pics);
    // word starts with כּ — options: כּ vs others, may include ח visually since word is shown
    return{prompt:"במה פותחת המילה? לחצו על האות",speak:["q_initial",pic.key],stageHtml:`<div class="picem">${pic.em}</div><div class="picw">${pic.w}</div>`,kind:"letters",
      choices:shuffle([{v:"כּ",label:"כּ"},{v:"כ",label:"כ"},{v:"ח",label:"ח"},{v:"ד",label:"ד"}]),answer:"כּ"};
  }
  if(mode==="hard_sound"){
    // hear hard kaf — never offer soft כ or ח as options
    return{prompt:"איזה צליל שומעים? לחצו על האות",speak:["q_sound","snd_k_hard"],stageHtml:`<div style="font-size:40px">👂</div><p class="note">הקשיבו ואז לחצו</p>`,kind:"letters",
      choices:letterChoices("כּ",4,HEAR_POOL).map(ch=>({v:ch,label:ch})),answer:"כּ"};
  }
  // hard_id: show כּ, ask which letter — visual+sound support; options without soft confusables by ear alone is fine since letter is shown
  return{prompt:"איזו אות זאת?",speak:["q_which_letter","snd_k_hard"],stageHtml:`<div class="bigletter">כּ</div><p class="note">הקשיבו לצליל</p>`,kind:"letters",
    choices:shuffle([{v:"כּ",label:"כּ"},{v:"כ",label:"כ"},{v:"ח",label:"ח"},{v:"ס",label:"ס"}]),answer:"כּ"};
}

function makeSoundsMix(){
  // sound mix: only letters with distinct sounds — d,s,kh (hard). NOT soft כ, and if using ח don't pair with soft כ.
  const keys=["d","h","s","kh"];
  const lk=pick(keys);
  const L=LETTERS[lk];
  const mode=pick(["initial","matchpic","sound"]);
  if(mode==="sound"){
    return{prompt:"איזה צליל שומעים? לחצו על האות",speak:["q_sound",L.snd],stageHtml:`<div style="font-size:40px">👂</div><p class="note">הקשיבו ואז לחצו</p>`,kind:"letters",
      choices:hearChoicesFor(L.ch).map(ch=>({v:ch,label:ch})),answer:L.ch};
  }
  if(mode==="initial"){
    const pic=pick(L.pics);
    return{prompt:"במה פותחת המילה? לחצו על האות",speak:["q_initial",pic.key],stageHtml:`<div class="picem">${pic.em}</div><div class="picw">${pic.w}</div>`,kind:"letters",
      choices:hearChoicesFor(L.ch).map(ch=>({v:ch,label:ch})),answer:L.ch};
  }
  const good=pick(L.pics);
  const bads=shuffle(DISTRACTOR_PICS).slice(0,3);
  return{prompt:"איזו תמונה מתחילה בצליל של האות?",speak:["q_match_pic",L.snd],stageHtml:`<div class="bigletter">${L.ch}</div>`,kind:"pics",
    choices:shuffle([good,...bads]).map(p=>({v:p.key,label:p.w,em:p.em,ok:p.key===good.key})),answer:good.key};
}

function renderEx(){
  $("#exPrompt").textContent=exercise.prompt;
  $("#exStage").innerHTML=exercise.stageHtml;
  const box=$("#exChoices");
  if(exercise.kind==="pics"){
    box.className="picgrid";
    box.innerHTML=exercise.choices.map((c,i)=>`<button class="pic" type="button" data-i="${i}"><span class="em">${c.em}</span><span class="w">${c.label}</span></button>`).join("");
  } else {
    box.className="choices";
    box.innerHTML=exercise.choices.map((c,i)=>`<button class="cbtn" type="button" data-i="${i}">${c.label}</button>`).join("");
  }
  box.onclick=onChoice;
}
function onChoice(e){
  const b=e.target.closest(".cbtn,.pic");if(!b||answered)return;
  const c=exercise.choices[+b.dataset.i];
  const ok=(c.ok===true)||(c.v===exercise.answer);
  if(ok){answered=true;b.classList.add("ok");document.querySelectorAll("#exChoices .cbtn,#exChoices .pic").forEach(x=>x.disabled=true);$("#exFb").className="fb on ok";$("#exFb").textContent="כל הכבוד! 🌟";$("#exActions").hidden=false;sayOk()}
  else{b.classList.add("bad");b.disabled=true;$("#exFb").className="fb on bad";$("#exFb").textContent="נסו שוב 🙂";sayBad();setTimeout(()=>{if(!answered){$("#exFb").className="fb";$("#exFb").textContent=""}},1000)}
}
$("#btnMenu").onclick=()=>{stopSpeak();$("#helpPanel").classList.remove("on");show("sc-menu")};
$("#btnMore").onclick=()=>newExercise();
$("#btnNext").onclick=()=>{topicIdx=(topicIdx+1)%TOPICS.length;startTopic()};
$("#btnSpeak").onclick=()=>{if(exercise)speakKeys(exercise.speak);else speakKeys(["welcome"])};
$("#btnMute").onclick=function(){muted=!muted;this.setAttribute("aria-pressed",muted?"true":"false");this.textContent=muted?"🔇":"🔈";if(muted)stopSpeak()};
$("#btnHelp").onclick=()=>{const t=TOPICS[topicIdx];$("#helpTitle").textContent="עזרה";$("#helpH2").textContent=t.t;$("#helpBody").textContent=t.help;$("#helpPanel").classList.add("on");speakKeys([t.k==="k"?"help_k":(t.k==="sounds"?"help_initial":"help_letter")])};
$("#helpClose").onclick=()=>{$("#helpPanel").classList.remove("on");stopSpeak()};
buildMenu();
})();
</script>
</body>
